services:
  postgres:
    image: postgres:16-alpine
    container_name: renkoo-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: renkoo
      POSTGRES_USER: renkoo
      POSTGRES_PASSWORD: renkoo_dev_password
    ports: ["5432:5432"]
    volumes: [renkoo_postgres_data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U renkoo -d renkoo"]
      interval: 5s
      timeout: 5s
      retries: 10
  redis:
    image: redis:7-alpine
    container_name: renkoo-redis
    restart: unless-stopped
    ports: ["6379:6379"]
    volumes: [renkoo_redis_data:/data]
volumes:
  renkoo_postgres_data:
  renkoo_redis_data:
